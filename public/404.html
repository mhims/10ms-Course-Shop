<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <title>10MS Course Shop - রিডায়রেক্ট করা হচ্ছে...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/">
    <script type="text/javascript">
      // GitHub Pages SPA router & Fallback redirect to Homepage
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var rawPath = l.pathname.slice(1);
      
      // Known sub-routes that can be handled by SPA
      var isKnownSection = rawPath.startsWith('courses') || 
                           rawPath.startsWith('blog') || 
                           rawPath.startsWith('review') || 
                           rawPath.startsWith('class-') || 
                           rawPath.startsWith('hsc') || 
                           rawPath.startsWith('ssc') || 
                           rawPath.startsWith('admission') || 
                           rawPath.startsWith('skills') || 
                           rawPath.startsWith('spoken-english') || 
                           rawPath.startsWith('job-prep') || 
                           rawPath.startsWith('adminpanelofficial');

      if (rawPath && isKnownSection) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        // Any broken link or unknown URL redirects seamlessly to Homepage
        window.location.replace('/');
      }
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #faf5f5;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        max-width: 450px;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        background: #e11d48;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin: 0 0 8px 0; color: #e11d48;">10MS Course Shop</h2>
      <p style="margin: 0 0 16px 0; color: #64748b; font-size: 14px;">পৃষ্ঠাটি লোড হচ্ছে এবং হোমপেজে নিয়ে যাওয়া হচ্ছে...</p>
      <a href="/" class="btn">হোমপেজে যান</a>
    </div>
    <script>
      setTimeout(function() {
        window.location.replace('/');
      }, 300);
    </script>
  </body>
</html>
